org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1g
org.gradle.caching=true
kotlin.code.style=official
android.useAndroidX=true

# 배포 좌표 — 모듈별 artifactId 는 각 build.gradle.kts 의 coordinates 가 정한다
GROUP=net.plumt.ads

POM_URL=https://github.com/plumt/sdk-kotlin-ads
POM_LICENSE_NAME=The Apache License, Version 2.0
POM_LICENSE_URL=https://www.apache.org/licenses/LICENSE-2.0.txt
POM_LICENSE_DIST=repo
POM_SCM_URL=https://github.com/plumt/sdk-kotlin-ads
POM_SCM_CONNECTION=scm:git:git://github.com/plumt/sdk-kotlin-ads.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/plumt/sdk-kotlin-ads.git
POM_DEVELOPER_ID=plumt
POM_DEVELOPER_NAME=plumt
POM_DEVELOPER_URL=https://plumt.net

# AGP 9 의 내장 Kotlin 에서는 binary-compatibility-validator 가 apiDump 를 만들지 못한다.
# 공개 API 고정을 위해 기존 Kotlin 플러그인 경로로 되돌린다(AGP 10 에서 제거되면 Kotlin 내장 ABI 검증으로 옮긴다)
android.builtInKotlin=false
android.newDsl=false
